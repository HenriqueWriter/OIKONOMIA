<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oikonomia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">
        <!-- Linha 1 -->
        <!-- SALDO LIVRE -->
        <div class="card-simples saldo">
            <div class="conteudo">
                <h3>Saldo Livre</h3>

                <!-- Campo para inserir ou editar -->
                <div id="campoSaldo">
                    <input type="text" id="salario" placeholder="R$ 0,00" inputmode="decimal">
                </div>

                <!-- Texto com saldo cadastrado -->
                <div id="saldoExibido" style="display: none;">

                    <span id="valorSaldo"></span>

                    <button type="button" id="btnEditarSaldo">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- GRÁFICO -->
        <div class="card-grafico grafico">
            <canvas id="graficoGastos"></canvas>
        </div>

        <!-- STATUS -->
        <div class="card-simples status">
            <div class="conteudo-status">
                <h3>Status</h3>

                <p id="porcentagemStatus">0%</p>

                <span id="mensagemStatus">Normal</span>

                <button id="btnRelatorio">
                    Gerar Relatório
                </button>
            </div>
        </div>

        <!-- Linha 2 -->


        <!-- DESPESAS FIXAS -->
        <div class="card-despesas">
            <h3>Despesas Fixas</h3>
            <div class="input_despesas">
                <input type="text" id="descrição_despesas" placeholder="Nome da despesa">

                <input type="text" id="valor_despesas" placeholder="0,00" inputmode="decimal"
                    oninput="mascaraDespesa(this)">

                <button type="button" id="btn_AddDespesas">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <button type="button" id="btn_SalvarEdicao" style="display: none;">
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaFixas"></tbody>

                <tfoot>
                    <tr>
                        <td colspan="3" id="totalDespesas">
                            TOTAL: R$ 0,00
                        </td>
                    </tr>
                </tfoot>
            </table>
            <br>
        </div>


        <!-- GASTOS DO DIA -->
        <div class="card gastos-dia">

            <h3>Gasto do dia</h3>

            <input type="text" id="gasto" placeholder="R$ 0,00" oninput="mascaraMoeda(this)">

            <button id="BtnGastosDia" onclick="adicionarGasto()">
                Adicionar
            </button>

            <button id="btnSalvarEdicaoGasto" onclick="salvarEdicaoGasto()" style="display: none;">
                Salvar edição
            </button>

            <table id="tabela-gastos">

                <thead>
                    <tr>
                        <th>Valor</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Linhas via JavaScript -->
                </tbody>

            </table>

        </div>

        <!-- MODELOS -->
        <div class="card_modelos">

            <h3>Modelos</h3>

            <div class="botoes-modelos">

                <button type="button" id="Modelo50_30_20">
                    50-30-20
                </button>

                <button type="button" id="Modelo70_30">
                    70-30
                </button>

                <button type="button" id="ModeloPersona">
                    Personalizado
                </button>

            </div>

            <!-- PERSONALIZAR PORCENTAGENS -->
            <div id="personalizarModelo" style="display: none;">

                <h4>Personalizar divisão</h4>

                <label>Gasto Livre (%)</label>
                <input type="number" id="porcentagemGasto" min="0" max="100" value="50">

                <label>Investimento (%)</label>
                <input type="number" id="porcentagemInvestimento" min="0" max="100" value="30">

                <label>Reserva (%)</label>
                <input type="number" id="porcentagemReserva" min="0" max="100" value="20">

                <p id="somaPorcentagens">Total: 100%</p>

                <button type="button" id="btnAplicarPersonalizado">
                    Aplicar modelo
                </button>

            </div>

            <!-- RESULTADO DA DIVISÃO -->
            <div id="resultadoModelo" style="display: none;">

                <h4 id="tituloModelo"></h4>

                <div id="listaDistribuicao"></div>

            </div>

        </div>


    </div>

    <script src="script.js" defer></script>
    <script src="relatorio.js" defer></script>
</body>

</html>
